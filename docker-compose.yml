services:
  sadparts:
    build: .
    ports:
      - "888:888"
    environment:
      HOST: "0.0.0.0"
      PORT: "888"
      PRICE_MAILBOX_ADDRESS: ${PRICE_MAILBOX_ADDRESS:-prajsy@sadparts.ru}
      PRICE_MAILBOX_SECRET: ${PRICE_MAILBOX_SECRET:-}
      PRICE_IMAP_HOST: ${PRICE_IMAP_HOST:-}
      PRICE_IMAP_PORT: ${PRICE_IMAP_PORT:-993}
      PRICE_IMAP_USER: ${PRICE_IMAP_USER:-}
      PRICE_IMAP_PASS: ${PRICE_IMAP_PASS:-}
      PRICE_IMAP_TLS: ${PRICE_IMAP_TLS:-1}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
